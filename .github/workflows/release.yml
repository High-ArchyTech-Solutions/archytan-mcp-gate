# On a version tag: runs the suite, builds archytan-mcp-gate for macOS,
# Linux and Windows, checksums the binaries, signs the checksum file with
# cosign keyless signing, verifies it the way users will, and attaches it
# all to a draft release in this repository. The release stays a draft until
# a person has written its notes and published it.
#
# The builds use -trimpath with cgo off, so a release can be rebuilt from
# its tag with the Go version in go.mod and compared against SHA256SUMS.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create the draft release.
      contents: write
      # cosign keyless signing.
      id-token: write
    env:
      ARCHYTAN_MCP_GATE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./... -count=1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/archytan-mcp-gate-${os}-${arch}${ext}" ./cmd/archytan-mcp-gate
          done
          cd dist && sha256sum archytan-mcp-gate-* > SHA256SUMS && cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless: the signature is tied to this workflow's identity and logged
      # in Sigstore's transparency log, so there's no signing key to keep.
      # Signing the checksum file covers every binary.
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.cosign.bundle dist/SHA256SUMS

      - name: Verify the way users will
        run: |
          cosign verify-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archytan-mcp-gate-${{ github.ref_name }}
          path: dist/

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "archytan-mcp-gate ${GITHUB_REF_NAME#v}" \
            --notes "Release notes to follow." dist/*
