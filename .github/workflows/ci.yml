# Format, vet, the full suite and the race detector on Linux, where Docker
# runs the published Archytan Lite gate service image for the end-to-end
# tests (required to run there, so they can't pass by skipping); unit tests
# on Windows and macOS; govulncheck; the locked-workspace kit's tests on all
# three. Actions are pinned to full commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      ARCHYTAN_MCP_GATE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with the race detector
        run: go test -race ./... -count=1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # The locked-workspace kit: the hook's decisions and the workspace
      # new-workspace.mjs writes.
      - name: Locked workspace kit
        run: node --test locked-workspace/test/kit.test.mjs

      # The MCP bundle a release attaches, from the same cross-builds: the
      # same bytes twice, a manifest the MCPB tools accept, and a launcher
      # that starts the gate after a plain unzip.
      - name: MCP bundle
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "dist/archytan-mcp-gate-${os}-${arch}${ext}" ./cmd/archytan-mcp-gate
          done
          v="$(jq -r .version internal/mcpbundle/manifest.json)"
          go run ./internal/mcpbundle/build -version "$v" -dist dist
          go run ./internal/mcpbundle/build -version "$v" -dist dist -out "$RUNNER_TEMP/again.mcpb"
          cmp dist/archytan-mcp-gate.mcpb "$RUNNER_TEMP/again.mcpb"
          npx --yes @anthropic-ai/mcpb@2.1.2 validate internal/mcpbundle/manifest.json
          mkdir "$RUNNER_TEMP/unpacked" && unzip -q dist/archytan-mcp-gate.mcpb -d "$RUNNER_TEMP/unpacked"
          status=0
          /bin/sh "$RUNNER_TEMP/unpacked/server/launch.sh" 2> "$RUNNER_TEMP/launch.err" || status=$?
          cat "$RUNNER_TEMP/launch.err"
          [ "$status" -eq 2 ] && grep -q "usage: archytan-mcp-gate" "$RUNNER_TEMP/launch.err"

  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # No Linux container engine on these runners: the end-to-end tests
      # skip here and say why. They run on Linux above.
      - name: Test
        run: go test ./... -count=1

      - name: Locked workspace kit
        run: node --test locked-workspace/test/kit.test.mjs
